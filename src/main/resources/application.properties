spring.application.name=Gerador de Ideias

spring.profiles.active=dev
server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=600
jwt.refresh-token-expiration=604800
ip.encryption.key=${IP_ENCRYPTION_KEY}

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:mistral}

chat.max-tokens-per-message=1000
chat.max-chars-per-message=1000
chat.max-tokens-per-chat=10000
chat.max-history-messages=3
chat.max-initial-messages=10
chat.ollama-timeout-seconds=60
chat.ollama-retry-attempts=3
chat.ollama-retry-delay-ms=1000
chat.max-response-length=100000
chat.ollama-num-predict=300
chat.ollama-temperature=0.7
chat.ollama-top-p=0.9
chat.ollama-num-ctx=2048

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=2592000000
spring.cache.cache-names=userCache,consecutiveFailureCache,tokenBlacklist,aiResponseCache,ideasSummaryCache

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
admin.notification.email=${ADMIN_NOTIFICATION_EMAIL}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
